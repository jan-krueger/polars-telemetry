# OTLP in, InfluxDB line protocol out. No OpenTelemetry Collector involved.
[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = false

[[inputs.opentelemetry]]
  service_address = "0.0.0.0:4317"
  # prometheus-v2 keeps histogram buckets as separate fields, which is what
  # makes histogram_quantile-style maths possible later.
  metrics_schema = "prometheus-v2"
  # Span attributes promoted to line-protocol tags. In InfluxDB a tag is part
  # of the series key, so only bounded attributes belong here. Everything else
  # still arrives, bundled into the `attributes` field as JSON.
  #
  # Never promote polars.query_id (one series per query) or the scan/predicate
  # attributes (they carry literals).
  span_dimensions = [
    "service.name",
    "span.name",
    "polars.plan.fingerprint",
    "polars.engine",
    "polars.hot_node.kind",
  ]

# DogStatsD in, from DogStatsdExporter. Tags become line-protocol tags, so
# the exporter's tags are bounded the same way span_dimensions above are.
[[inputs.statsd]]
  protocol = "udp"
  service_address = ":8125"
  datadog_extensions = true
  # Send histograms (DogStatsdExporter(distributions=False)): Telegraf
  # summarises them per flush, but keeps only one sample of a distribution.
  percentiles = [50.0, 90.0, 99.0]
  metric_separator = "_"
  delete_counters = true
  delete_timings = true
  allowed_pending_messages = 100000

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "polars-telemetry-dev-token"
  organization = "polars"
  bucket = "telemetry"
