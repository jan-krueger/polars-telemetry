version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /viewer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      build:
        patterns:
          - vite
          - vitest
          - "@vitejs/*"
          - vite-plugin-singlefile
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # polars moves with the support window, which is a deliberate, tested act.
      - dependency-name: polars
