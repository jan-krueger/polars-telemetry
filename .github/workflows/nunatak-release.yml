name: nunatak-release

on:
  push:
    tags: ["nunatak-v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  page:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' nunatak/Cargo.toml | head -1)
          if [ "nunatak-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match nunatak/Cargo.toml ($version)"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci && npm run build:nunatak
        working-directory: viewer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: page
          path: nunatak/web/nunatak.html

  binaries:
    needs: page
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nunatak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: page
          path: nunatak/web
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: The binary serves its dashboard and receives events
        run: |
          bin=target/${{ matrix.target }}/release/nunatak
          "$bin" --version
          NUNATAK_TOKEN=smoke "$bin" --bind 127.0.0.1:7799 --data "$RUNNER_TEMP/data" &
          server=$!
          for attempt in $(seq 50); do curl -sf http://127.0.0.1:7799/v1/health && break; sleep 0.2; done
          curl -sf http://127.0.0.1:7799/ > page.html
          grep -q '<script' page.html
          if grep -q 'built without its dashboard' page.html; then exit 1; fi
          kill "$server"
      - name: Package
        run: |
          name="nunatak-${GITHUB_REF_NAME#nunatak-v}-${{ matrix.target }}"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C "target/${{ matrix.target }}/release" nunatak
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: nunatak/dist/

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Nunatak ${{ github.ref_name }}
          make_latest: "false"
          files: dist/*

  image:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*-linux-musl
          merge-multiple: true
          path: dist/
      - name: Lay out the image's files
        run: |
          mkdir -p context/amd64 context/arm64 context/data
          tar -xzf dist/*-x86_64-unknown-linux-musl.tar.gz -C context/amd64
          tar -xzf dist/*-aarch64-unknown-linux-musl.tar.gz -C context/arm64
      - name: Build and push ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nunatak"
          version="${GITHUB_REF_NAME#nunatak-v}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            -t "$image:$version" -t "$image:latest" \
            -f nunatak/Dockerfile context
