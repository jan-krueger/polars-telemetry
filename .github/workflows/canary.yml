# Early warning for changes to polars' observer interface, which is private and
# carries no deprecation cycle. Allowed to fail; opens an issue instead.
name: canary

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  newest-polars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - run: uv sync --locked

      # Lift the 7-day release quarantine for polars only; seeing new polars
      # early is the point of this job.
      - name: Install newest polars
        run: |
          uv pip install --prerelease=allow --upgrade \
            --exclude-newer-package "polars=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            polars
          uv run python -c "import polars; print(polars.__version__)"

      - id: contract
        run: uv run pytest -m "contract and live" -v

      - run: uv run pytest -m bench

      - name: Report a broken contract
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `canary: polars contract check failed (run ${context.runNumber})`;
            const body = [
              'The live contract test failed against the newest polars.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Check `src/polars_telemetry/adapter/` -- it is the only layer that',
              'should need changes.',
            ].join('\n');
            // Labels are not created implicitly by the issues API.
            for (const [name, color] of [['canary', 'd93f0b'], ['upstream', '0e8a16']]) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo, name, color,
                });
              } catch (error) {
                if (error.status !== 422) throw error;  // 422 = already exists
              }
            }
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'canary',
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['canary', 'upstream'],
              });
            }
