name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml re-runs the full suite before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv run nox -s lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv run nox -s typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Corners plus the primary cell. The hook first appears in 1.44.
        python: ["3.10", "3.14"]
        polars: ["1.44.1", "1.44.2"]
        include:
          - python: "3.12"
            polars: "1.44.2"
          # The coming major version, newest pre-release, so a breaking
          # release candidate shows up here before users meet it.
          - python: "3.12"
            polars: "2 pre-release"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Install the polars under test
        run: |
          if [ "${{ matrix.polars }}" = "2 pre-release" ]; then
            uv pip install --prerelease=allow \
              --exclude-newer-package polars=2099-01-01 \
              --exclude-newer-package polars-runtime-32=2099-01-01 \
              --exclude-newer-package polars-runtime-64=2099-01-01 \
              --exclude-newer-package polars-runtime-compat=2099-01-01 \
              "polars>=2.0.0rc1,<3"
          else
            uv pip install "polars==${{ matrix.polars }}"
          fi
          installed=$(uv run --no-sync python -c "import importlib.metadata as m; print(m.version('polars'))")
          echo "testing against polars $installed"
          case "${{ matrix.polars }}" in
            "2 pre-release") case "$installed" in 2.*) ;; *) exit 1 ;; esac ;;
            *) [ "$installed" = "${{ matrix.polars }}" ] ;;
          esac
      # --no-sync: a plain uv run would put the locked polars back first.
      - run: uv run --no-sync nox -s test -- --cov --cov-report=xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: docker compose -f docker/compose.yaml up -d --wait
      - run: uv sync --locked
      - run: uv run nox -s integration
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
          REQUIRE_COLLECTOR: "1"
      - if: always()
        run: docker compose -f docker/compose.yaml down -v

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv run nox -s viewer-test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      # The profile viewer is a React Flow app; the docs site ships its build
      # output, which is generated rather than committed.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
      # --strict turns broken links and nav errors into failures.
      - run: uv run nox -s docs-build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run nox -s audit
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: --lockfile=uv.lock
