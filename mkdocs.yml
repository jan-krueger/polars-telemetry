site_name: polars-telemetry
site_description: "Profile Polars queries: per-node timings and row counts, a plan viewer, and findings on what slows a query down"
site_url: https://jan-krueger.github.io/polars-telemetry/
repo_url: https://github.com/jan-krueger/polars-telemetry
edit_uri: ""
strict: true

# --strict alone leaves anchors at INFO, so a renamed heading breaks links
# silently. File links are already checked.
validation:
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - toc.integrate
    - navigation.indexes
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Exporters:
      - exporters/index.md
      - OpenTelemetry: exporters/opentelemetry.md
      - DogStatsD: exporters/dogstatsd.md
      - JSONL: exporters/jsonl.md
      - Events: exporters/events.md
      - Events over HTTP: exporters/http-events.md
      - Console: exporters/console.md
      - Write your own: exporters/custom.md
  - Label and scope queries: labels.md
  - Profile viewer: profile-viewer.md
  - Insights: insights.md
  - Polars Cloud: polars-cloud.md
  - Reference:
      - Configuration: reference/configuration.md
      - Spans and metrics: reference/spans-and-metrics.md
      - Python API: reference/api.md
  - Data and privacy: privacy.md
  - Troubleshooting: troubleshooting.md
  - Internals:
      - How it works: internals/how-it-works.md
      - Compatibility: internals/compatibility.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_bases: false
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            show_labels: false
            docstring_section_style: list

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc: { permalink: true }
