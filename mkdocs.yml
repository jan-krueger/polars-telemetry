site_name: polars-telemetry
site_description: OpenTelemetry instrumentation for Polars query execution
site_url: https://jan-krueger.github.io/polars-telemetry/
repo_url: https://github.com/jan-krueger/polars-telemetry
edit_uri: ""
strict: true

# --strict alone leaves anchors at INFO, so a renamed heading breaks links
# silently. File links are already checked.
validation:
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Profiles: profiles.md
  - Attribute reference: attributes.md
  - How it works: how-it-works.md
  - Compatibility: compatibility.md
  - Python API: reference/api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_bases: false
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            show_labels: false
            docstring_section_style: list

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc: { permalink: true }
