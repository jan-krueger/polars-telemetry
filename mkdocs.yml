site_name: polars-telemetry
site_description: OpenTelemetry instrumentation for Polars query execution
site_url: https://jan-krueger.github.io/polars-telemetry/
repo_url: https://github.com/jan-krueger/polars-telemetry
edit_uri: ""
strict: true

# --strict alone leaves anchors at INFO, so a renamed heading breaks links
# silently. File links are already checked.
validation:
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Profiles: profiles.md
  - Attribute reference: attributes.md
  - How it works: how-it-works.md
  - Compatibility: compatibility.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc: { permalink: true }
