<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>polars-telemetry — Profile Viewer</title>
<style>
  :root{
    color-scheme:light;
    --plane:#f4f5f4; --surface:#fcfcfb; --surface-2:#eceeec;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.11);
    --accent:#2a78d6;
    --sq1:#86b6ef; --sq1-ink:#0b0b0b; --sq2:#256abf; --sq2-ink:#fff;
    --sq3:#184f95; --sq3-ink:#fff;  --sq4:#0d366b; --sq4-ink:#fff;
    --good:#0ca30c; --warn:#b8860b; --crit:#d03b3b;
    --up:#d03b3b; --down:#0ca30c;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    color-scheme:dark;
    --plane:#0c0c0c; --surface:#171716; --surface-2:#201f1e;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#8c8a84;
    --grid:#2c2c2a; --axis:#3a3a37; --border:rgba(255,255,255,.12);
    --accent:#3987e5;
    --sq1:#184f95; --sq1-ink:#fff; --sq2:#2a78d6; --sq2-ink:#fff;
    --sq3:#6da7ec; --sq3-ink:#0b0b0b; --sq4:#b7d3f6; --sq4-ink:#0b0b0b;
    --good:#0ca30c; --warn:#fab219; --crit:#e2726c;
    --up:#e2726c; --down:#0ca30c;
  }}
  :root[data-theme="dark"]{
    color-scheme:dark;
    --plane:#0c0c0c; --surface:#171716; --surface-2:#201f1e;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#8c8a84;
    --grid:#2c2c2a; --axis:#3a3a37; --border:rgba(255,255,255,.12);
    --accent:#3987e5;
    --sq1:#184f95; --sq1-ink:#fff; --sq2:#2a78d6; --sq2-ink:#fff;
    --sq3:#6da7ec; --sq3-ink:#0b0b0b; --sq4:#b7d3f6; --sq4-ink:#0b0b0b;
    --good:#0ca30c; --warn:#fab219; --crit:#e2726c;
    --up:#e2726c; --down:#0ca30c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);
    font:13.5px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  button{font:inherit;color:inherit}

  header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface)}
  .brand{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
  .brand span{color:var(--muted);font-weight:400}
  .drop{margin-left:auto;display:flex;align-items:center;gap:10px}
  .drop .hint{font-size:12px;color:var(--muted)}
  .btn{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
    padding:5px 11px;font-size:12.5px;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  body.dragging{outline:2px dashed var(--accent);outline-offset:-8px}

  .shell{display:grid;grid-template-columns:252px minmax(0,1fr) 294px;
    gap:0;height:calc(100vh - 53px)}
  .rail{border-right:1px solid var(--border);background:var(--surface);
    overflow-y:auto;padding:12px}
  .rail.right{border-right:0;border-left:1px solid var(--border)}
  main{overflow-y:auto;padding:16px 18px}
  h2{font:600 10.5px/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:0 0 10px}

  /* session list */
  .shape{margin-bottom:12px}
  .shape .fp{font:11px ui-monospace,monospace;color:var(--muted);margin-bottom:5px;
    display:flex;justify-content:space-between}
  .run{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;
    border-left:2px solid var(--border);border-radius:0 5px 5px 0;padding:6px 9px;cursor:pointer;
    margin-bottom:2px}
  .run:hover{background:var(--surface-2)}
  .run[aria-pressed="true"]{border-left-color:var(--accent);background:var(--surface-2)}
  .run .l1{font-size:12.5px;font-weight:500}
  .run .l2{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;
    background:var(--border);border:1px solid var(--border);border-radius:7px;overflow:hidden;
    margin-bottom:14px}
  .tile{background:var(--surface);padding:9px 11px}
  .tile .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .tile .v{font-size:17px;margin-top:2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile .u{font-size:11px;color:var(--ink-2);margin-left:2px}
  .tile .d{font-size:11px;font-variant-numeric:tabular-nums;margin-top:1px}

  /* diagnostics */
  .diags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .diag{border:1px solid var(--border);border-radius:7px;background:var(--surface);
    padding:8px 11px;min-width:142px}
  .diag .t{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .diag .v{font-size:16px;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .diag .v .u{font-size:11px;color:var(--ink-2)}
  .diag .n{font-size:10.5px;color:var(--muted);margin-top:2px}

  /* plan */
  .planbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .seg button{background:var(--surface);border:0;padding:4px 12px;font-size:12px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:1250px){ .plans{grid-template-columns:1fr} }
  .planbox{border:1px solid var(--border);border-radius:7px;background:var(--surface);
    display:flex;flex-direction:column;min-width:0}
  .planbox .ph{padding:7px 11px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:8px}
  .planbox .ph .nm{font:600 11.5px system-ui}
  .planbox .ph .sub{font-size:10.5px;color:var(--muted);margin-left:auto}
  .planbox .body{overflow:auto;max-height:58vh;padding:10px}
  .edge.logical{stroke-dasharray:4 3;stroke:var(--axis)}
  svg.dag{display:block;margin:0 auto;height:auto}
  .nd{cursor:pointer}
  .nd rect{stroke:var(--border)}
  .nd:hover rect{stroke:var(--accent);stroke-width:2}
  .nd[data-sel="1"] rect{stroke:var(--accent);stroke-width:2.5}
  .nd .t1{font:600 11px ui-monospace,monospace}
  .nd .t2{font:9.5px system-ui,sans-serif}
  .edge{stroke:var(--axis);stroke-width:1.6;fill:none}
  .edgelbl{font:9.5px ui-monospace,monospace;fill:var(--ink-2);font-variant-numeric:tabular-nums}
  .pill{fill:var(--surface-2);stroke:var(--border);stroke-width:1}
  .nd .t1,.nd .t2{text-anchor:start}

  /* node details */
  .kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;
    border:1px solid currentColor;border-radius:4px;padding:2px 7px}
  .card{border:1px solid var(--border);border-radius:8px;background:var(--surface);
    padding:12px 13px;margin-bottom:12px}
  .card .hd{display:flex;align-items:center;gap:7px;margin-bottom:10px}
  .card .hd .nm{font:600 13px system-ui;letter-spacing:-.01em}
  .card .hd .ic{font-size:12px;color:var(--muted)}
  .field{padding:7px 0;border-top:1px solid var(--grid)}
  .field:first-of-type{border-top:0;padding-top:0}
  .field .lbl{font-size:11.5px;color:var(--muted);margin-bottom:5px}
  .field.inline{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .field.inline .lbl{margin:0}
  .expr{background:#15181d;color:#e6edf3;border-radius:5px;padding:7px 9px;
    font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap;word-break:break-word;overflow-x:auto}
  .expr .s{color:#7ec7ff}
  .chip{font:11px ui-monospace,monospace;border:1px solid var(--border);border-radius:5px;
    padding:3px 8px;color:var(--ink-2);white-space:nowrap}
  .help{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;
    border:1px solid var(--axis);border-radius:50%;font:9px/1 system-ui;color:var(--muted);
    margin-left:5px;cursor:help;vertical-align:middle;flex:none}
  .help:hover{border-color:var(--accent);color:var(--accent)}
  #tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .08s;
    background:var(--surface);color:var(--ink-2);border:1px solid var(--border);
    border-radius:7px;padding:9px 11px;font:12px/1.5 system-ui;max-width:290px;
    box-shadow:0 6px 22px rgba(0,0,0,.18)}
  #tip b{color:var(--ink);display:block;margin-bottom:3px;font-size:12px}
  .mrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:6px 0;border-top:1px solid var(--grid);font-size:12px}
  .mrow:first-of-type{border-top:0}
  .mrow .k{color:var(--muted)}
  .mrow .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mrow .v .u{font-weight:400;color:var(--muted);font-size:11px;margin-left:2px}
  .empty{color:var(--muted);font-size:12.5px;padding:18px 4px;text-align:center}
  .delta-up{color:var(--up)} .delta-down{color:var(--down)}
  .sel{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;
    padding:4px 8px;font-size:12px;max-width:100%}
  /* sessions library */
  .sessions{margin-bottom:16px}
  .sessrow{display:flex;align-items:center;gap:6px;border:1px solid transparent;
    border-left:2px solid var(--border);border-radius:0 5px 5px 0;padding:6px 8px;margin-bottom:3px}
  .sessrow:hover{background:var(--surface-2)}
  .sessrow[aria-current="true"]{border-left-color:var(--accent);background:var(--surface-2)}
  .sessrow .pick{flex:1;background:none;border:0;text-align:left;cursor:pointer;padding:0;min-width:0}
  .sessrow .nm{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sessrow .mt{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;
    line-height:1;padding:2px 4px;border-radius:4px}
  .x:hover{color:var(--crit);background:var(--surface-2)}
  .railfoot{display:flex;justify-content:space-between;align-items:center;
    font-size:10.5px;color:var(--muted);padding-top:6px;border-top:1px solid var(--border)}
  .link{background:none;border:0;color:var(--accent);cursor:pointer;font-size:11px;padding:0}
  .link:hover{text-decoration:underline}

  /* empty state */
  .blank{max-width:560px;margin:8vh auto;text-align:center}
  .blank h3{font:600 19px/1.3 system-ui;margin:0 0 8px;letter-spacing:-.015em}
  .blank p{color:var(--ink-2);font-size:13.5px;margin:0 0 16px}
  .zone{border:1.5px dashed var(--axis);border-radius:10px;padding:26px 20px;
    background:var(--surface);margin-bottom:14px}
  .zone .big{font-size:14px;font-weight:500;margin-bottom:4px}
  .zone .small{font-size:12px;color:var(--muted)}
  pre.snip{text-align:left;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;padding:12px 14px;font:11.5px/1.65 ui-monospace,monospace;
    color:var(--ink-2);overflow-x:auto;margin:0 0 14px}
  pre.snip b{color:var(--ink);font-weight:500}
  .note{font-size:11.5px;color:var(--muted)}

  /* session overview */
  .ovw{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:4px}
  .ovw th{text-align:right;font:500 10px ui-monospace,monospace;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);padding:5px 9px;border-bottom:1px solid var(--border)}
  .ovw th:first-child,.ovw td:first-child{text-align:left}
  .ovw td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--grid);
    font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .ovw tbody tr{cursor:pointer}
  .ovw tbody tr:hover{background:var(--surface-2)}
  .ovw .bar{height:5px;border-radius:3px;background:var(--sq2);min-width:2px}
  @media (max-width:1100px){
    .shell{grid-template-columns:1fr;height:auto}
    .rail,.rail.right{border:0;border-bottom:1px solid var(--border)}
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">polars-telemetry <span>· profile viewer</span></div>
  <div class="drop">
    <span class="hint" id="src"></span>
    <button class="btn" id="pick">Open .jsonl</button>
    <input type="file" id="file" accept=".jsonl,.json" multiple hidden>
  </div>
</header>
<div class="shell" id="shell">
  <aside class="rail">
    <div id="sessions"></div>
    <div id="session"></div>
  </aside>
  <main id="main"></main>
  <aside class="rail right"><h2>Node details</h2><div id="node"></div></aside>
</div>
<div id="tip"></div>

/* ---------- storage: IndexedDB, because a session runs to megabytes ---------- */
const DB_NAME="polars-telemetry-viewer", STORE="sessions", DB_VERSION=1;
let dbFailed=false;

const OPEN_TIMEOUT_MS = 1500;

function openDb(){
  return new Promise((resolve,reject)=>{
    let req;
    try{ req=indexedDB.open(DB_NAME,DB_VERSION); }catch(e){ reject(e); return; }
    // An opened-from-file:// page, or a storage request the browser is sitting
    // on, can leave this request neither resolved nor rejected. Without a
    // timeout the whole page would wait on it forever.
    const timer=setTimeout(()=>reject(new Error("indexedDB open timed out")), OPEN_TIMEOUT_MS);
    const settle=(fn,v)=>{ clearTimeout(timer); fn(v); };
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:"id"});
    };
    req.onsuccess=()=>settle(resolve,req.result);
    req.onerror=()=>settle(reject,req.error);
    req.onblocked=()=>settle(reject,new Error("indexedDB blocked"));
  });
}
async function tx(mode,fn){
  if(dbFailed) return null;
  try{
    const db=await openDb();
    return await new Promise((resolve,reject)=>{
      const t=db.transaction(STORE,mode), r=fn(t.objectStore(STORE));
      t.oncomplete=()=>resolve(r?.result ?? null);
      t.onerror=()=>reject(t.error);
      t.onabort=()=>reject(t.error);
    });
  }catch(e){
    // Private windows and blocked site data both land here. Keep working in
    // memory rather than failing; just stop promising persistence.
    dbFailed=true; return null;
  }
}
const saveSession=s=>tx("readwrite",st=>st.put(s));
const allSessions=()=>tx("readonly",st=>st.getAll());
const dropSession=id=>tx("readwrite",st=>st.delete(id));
const dropAll=()=>tx("readwrite",st=>st.clear());

const profiles=()=>current?.profiles ?? [];

const num=(v,d=0)=>(v??0).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const ms=v=>v>=10?num(v,1)+" ms":v>=0.1?num(v,2)+" ms":num(v*1000,0)+" µs";
const rws=v=>v>=1e6?num(v/1e6,2)+"M":v>=1e3?num(v/1e3,1)+"k":num(v,0);
const kb=b=>b>=1048576?num(b/1048576,1)+" MB":num(b/1024,0)+" KB";
const bin=p=>p>=50?4:p>=10?3:p>=1?2:1;
const fillOf=p=>`var(--sq${bin(p)})`, inkOf=p=>`var(--sq${bin(p)}-ink)`;
const cpuOf=n=>(n.metrics?.total_time_ns ?? 0)/1e6;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shapeName(p){
  const l=p.plan.logical, k=c=>l.filter(n=>n.kind===c).length;
  const g=l.find(n=>n.kind==="GroupBy")?.properties?.keys||[];
  const s=l.find(n=>n.kind==="Scan")?.properties?.first_source;
  const bits=[];
  if(s) bits.push(String(s).split("/").pop());
  if(k("Join")) bits.push(`${k("Join")} join${k("Join")>1?"s":""}`);
  if(g.length) bits.push("by "+g.map(x=>String(x).slice(4,-1).replace(/"/g,"")).join(", "));
  return bits.join(" · ") || `${p.plan.physical.length} nodes`;
}

/* ---------- import ---------- */
function parseJsonl(text){
  const out=[];
  for(const line of text.split("\n")){
    const t=line.trim(); if(!t) continue;
    try{ const d=JSON.parse(t); if(String(d.schema||"").startsWith("polars-telemetry/profile")) out.push(d); }
    catch(e){ /* a truncated final line is expected; skip it */ }
  }
  return out;
}
async function importFiles(files){
  let added=0, skipped=0;
  for(const f of files){
    const parsed=parseJsonl(await f.text());
    if(!parsed.length){ skipped++; continue; }
    const session={ id:crypto.randomUUID(), name:f.name, importedAt:Date.now(),
                    bytes:f.size, profiles:parsed };
    sessions.unshift(session); await saveSession(session); added++;
  }
  if(!added) alert(`No polars-telemetry profiles found in ${skipped===1?"that file":"those files"}.`);
  else selectSession(sessions[0].id);
  render();
}
async function loadSample(){
  const session={ id:crypto.randomUUID(), name:"sample-session.jsonl", importedAt:Date.now(),
                  bytes:JSON.stringify(SAMPLE).length, profiles:SAMPLE, sample:true };
  sessions.unshift(session); await saveSession(session);
  selectSession(session.id); render();
}
function selectSession(id){
  current=sessions.find(s=>s.id===id) ?? null;
  sel=null; selNode=null; compareWith=null;
}
async function removeSession(id){
  sessions=sessions.filter(s=>s.id!==id); await dropSession(id);
  if(current?.id===id) selectSession(sessions[0]?.id);
  render();
}
async function removeAll(){
  if(!confirm("Remove every imported session from this browser?")) return;
  sessions=[]; current=null; sel=null; await dropAll(); render();
}

document.getElementById("pick").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{ if(e.target.files.length) importFiles([...e.target.files]); e.target.value=""; };
addEventListener("dragover",e=>{e.preventDefault();document.body.classList.add("dragging")});
addEventListener("dragleave",e=>{ if(e.relatedTarget===null) document.body.classList.remove("dragging"); });
addEventListener("drop",e=>{
  e.preventDefault(); document.body.classList.remove("dragging");
  if(e.dataTransfer.files.length) importFiles([...e.dataTransfer.files]);
});

      <button class="pick" data-id="${s.id}">

function renderQueryList(){
  const el=document.getElementById("session");
  if(!current){ el.innerHTML=""; return; }
  const groups={};
  profiles().forEach((p,i)=>(groups[p.fingerprint]??=[]).push(i));
  el.innerHTML=`<h2>Queries</h2>`;
  for(const [fp,idx] of Object.entries(groups)){
    const d=document.createElement("div"); d.className="shape";
    d.innerHTML=`<div class="fp"><span>${fp}</span><span>${idx.length} run${idx.length>1?"s":""}</span></div>`;
    idx.forEach(i=>{
      const p=profiles()[i], b=document.createElement("button");
      b.className="run"; b.setAttribute("aria-pressed", i===sel);
      b.innerHTML=`<div class="l1">${esc(shapeName(p))}</div>
        <div class="l2">${ms(p.wall_ms)} wall · ${ms(p.cpu_ms)} cpu</div>`;
      b.onclick=()=>{sel=i;selNode=hottestNode(p);compareWith=null;render()};
      d.appendChild(b);
    });
    el.appendChild(d);
  }
}
const hottestNode=p=>{
  const hot=p.plan.physical.filter(n=>n.metrics)
    .sort((a,b)=>b.metrics.total_time_ns-a.metrics.total_time_ns)[0];
  return hot?{plan:"physical", id:hot.id}:null;
};

function renderOverview(){
  const groups={};

    const g=(groups[p.fingerprint] ??= {fp:p.fingerprint,name:shapeName(p),runs:0,wall:0,cpu:0,first:p});

/* ---------- diagnostics ---------- */
function diagnostics(p){
  const d=p.diagnostics, out=[];
  if(d.parallel_efficiency!==undefined)
    out.push({k:"parallel_efficiency",t:"Parallel efficiency", v:num(d.parallel_efficiency*100,0), u:"%",
      s:d.parallel_efficiency>=.7?"good":d.parallel_efficiency>=.4?"warn":"crit",
      n:`${num(d.parallel_efficiency*(d.cpu_count||1),1)} of ${d.cpu_count} cores`});
  if(d.join_amplification!==undefined)
    out.push({k:"join_amplification",t:"Join amplification", v:num(d.join_amplification,2), u:"×",
      s:d.join_amplification<=1.5?"good":d.join_amplification<=4?"warn":"crit",
      n:d.join_amplification<=1.5?"no row explosion":"rows fanning out"});
  if(d.filter_selectivity!==undefined)
    out.push({k:"filter_selectivity",t:"Filter selectivity", v:num(d.filter_selectivity*100,1), u:"%",
      s:"info", n:`${num(d.filter_rows_dropped)} rows dropped`});
  if(d.morsel_skew!==undefined)
    out.push({k:"morsel_skew",t:"Morsel skew", v:num(d.morsel_skew,2), u:"×",
      s:d.morsel_skew<=2?"good":d.morsel_skew<=4?"warn":"crit",
      n:d.morsel_skew<=2?"partitions even":"largest morsel above the mean"});
  if(d.predicate_pushed!==undefined)
    out.push({k:"predicate_pushed",t:"Predicate pushdown", v:d.predicate_pushed?"yes":"no", u:"",
      s:d.predicate_pushed?"good":"warn",
      n:d.predicate_pushed?"filter inside the scan":"every row read"});
  if(d.incomplete_nodes)
    out.push({t:"Counters incomplete", v:d.incomplete_nodes, u:" nodes",
      s:"warn", n:"figures are a floor, not a total"});
  return out;
}
const C={good:"var(--good)",warn:"var(--warn)",crit:"var(--crit)",info:"var(--muted)"};

function renderDetail(){
  const p=profiles()[sel];

  const peers = profiles().map((q,i)=>[q,i]).filter(([q,i])=>q.fingerprint===p.fingerprint && i!==sel);

  const tile=(k,v,u,delta)=>`<div class="tile"><div class="k">${k}</div>

  const dlt=(a,b,unit,invert)=>{
    if(b==null) return "";

    <h2>${p.fingerprint} · ${new Date(p.started_unix_ns/1e6).toLocaleTimeString()}</h2>
    <div style="font-size:15px;font-weight:600;margin:-4px 0 12px">${shapeName(p)}</div>
    ${peers.length?`<div class="planbar"><span style="font-size:12px;color:var(--muted)">Compare with</span>
      <select class="sel" id="cmp"><option value="">— none —</option>
      ${peers.map(([q,i])=>`<option value="${i}" ${i===compareWith?"selected":""}>
        ${new Date(q.started_unix_ns/1e6).toLocaleTimeString()} · ${ms(q.wall_ms)}</option>`).join("")}
      </select></div>`:""}
    <div class="tiles">
      ${tile("wall",num(p.wall_ms,1),"ms",dlt(p.wall_ms,cmp?.wall_ms,"ms"))}
      ${tile("cpu",num(p.cpu_ms,1),"ms",dlt(p.cpu_ms,cmp?.cpu_ms,"ms"))}
      ${tile("nodes",p.plan.physical.length,"")}
      ${tile("rows out",num(p.result_rows??0),"")}
      ${tile("polars",p.polars_version,"")}
    </div>
    <div class="diags">${diagnostics(p).map(d=>`
      <div class="diag"><div class="t"><i class="dot" style="background:${C[d.s]}"></i>${d.t}${d.k?help(d.k):""}</div>
      <div class="v">${d.v}<span class="u">${d.u}</span></div><div class="n">${d.n}</div></div>`).join("")}</div>
    <div class="plans">
      <div class="planbox"><div class="ph"><span class="nm">Logical plan</span>
        <span class="sub">${p.plan.logical.length} nodes · your query as written</span></div>
        <div class="body"><svg class="dag" id="dag-logical"></svg></div></div>
      <div class="planbox"><div class="ph"><span class="nm">Physical plan</span>
        <span class="sub">fill = share of CPU · edges = rows</span></div>
        <div class="body"><svg class="dag" id="dag-physical"></svg></div></div>
    </div>
    <p class="note" style="margin:10px 0 0">polars gives the two plans separate node
      identities and no mapping between them, so selecting a node in one does not
      highlight its counterpart in the other.</p>`;

  const cmpSel=document.getElementById("cmp");
  if(cmpSel) cmpSel.onchange=()=>{compareWith=cmpSel.value===""?null:+cmpSel.value;render()};
  drawDag(p, "logical");
  drawDag(p, "physical");
  renderNode(p, cmp);
}

function drawDag(p, which){
  const logical = which==="logical";
  const nodes=p.plan[which], byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  const total=nodes.reduce((a,n)=>a+cpuOf(n),0)||1;
  const depth={}, D=n=>{ if(depth[n.id]!==undefined)return depth[n.id];
    depth[n.id]=n.inputs.length?1+Math.max(...n.inputs.map(i=>byId[i]?D(byId[i]):0)):0;
    return depth[n.id]; };
  nodes.forEach(D);
  const levels={}; nodes.forEach(n=>(levels[depth[n.id]]??=[]).push(n));
  const W=176,H=48,GX=22,GY=32;
  const maxd=Math.max(...Object.keys(levels).map(Number));
  const widest=Math.max(...Object.values(levels).map(l=>l.length));
  const vw=Math.max(widest*(W+GX)+30,420), vh=(maxd+1)*(H+GY)+24;
  const pos={};
  for(const [d,ns] of Object.entries(levels)){
    const span=ns.length*(W+GX)-GX, x0=(vw-span)/2;
    ns.forEach((n,i)=>pos[n.id]=[x0+i*(W+GX)+W/2, vh-16-(+d)*(H+GY)-H/2]);
  }
  let s="";
  for(const n of nodes) for(const inp of n.inputs){
    const a=pos[inp],b=pos[n.id]; if(!a||!b) continue;
    s+=`<path class="edge${logical?" logical":""}" d="M${a[0]} ${a[1]-H/2} C${a[0]} ${a[1]-H/2-16}, ${b[0]} ${b[1]+H/2+16}, ${b[0]} ${b[1]+H/2}"/>`;
    const rows=logical?null:byId[inp].metrics?.rows_sent;
    if(rows!=null){
      const label=`${rws(rows)} rows`, w=label.length*5.6+10;
      const cx=(a[0]+b[0])/2, cy=(a[1]-H/2+b[1]+H/2)/2;
      s+=`<rect class="pill" x="${cx-w/2}" y="${cy-8}" width="${w}" height="16" rx="8"/>`
        +`<text class="edgelbl" x="${cx}" y="${cy+3.5}" text-anchor="middle">${label}</text>`;
    }
  }
  for(const n of nodes){
    const q=pos[n.id], pc=cpuOf(n)/total*100;
    const label=nodeLabel(n);
    // The logical plan has no counters, so it is drawn as outline only: a
    // filled node would imply a cost it does not have.
    const ink = logical ? "var(--ink)" : inkOf(pc);
    const selected = selNode && selNode.plan===which && selNode.id===n.id;
    s+=`<g class="nd" data-id="${n.id}" data-sel="${selected?1:0}">
      <rect x="${q[0]-W/2}" y="${q[1]-H/2}" width="${W}" height="${H}" rx="6"
        fill="${logical?"var(--surface)":fillOf(pc)}" ${logical?'stroke="var(--rule-2)"':""}/>
      <text class="t1" x="${q[0]-W/2+10}" y="${q[1]-11}" fill="${ink}">${icon(n.kind)} ${esc(n.kind)}</text>
      ${label?`<text class="t2" x="${q[0]-W/2+10}" y="${q[1]+2}" fill="${ink}" opacity=".74">${esc(label.slice(0,26))}</text>`:""}
      ${n.metrics?`<text class="t2" x="${q[0]-W/2+10}" y="${q[1]+16}" fill="${ink}" opacity=".92">${pc>=.1?num(pc,1)+"% · ":""}${ms(cpuOf(n))}</text>`:""}
      ${(!logical&&n.metrics)?`<circle cx="${q[0]+W/2-11}" cy="${q[1]-H/2+11}" r="4"
         fill="${n.metrics.done?"var(--good)":"var(--warn)"}"><title>${n.metrics.done?"Completed":"Unfinished at snapshot"}</title></circle>`:""}
    </g>`;
  }
  const svg=document.getElementById("dag-"+which);
  svg.setAttribute("viewBox",`0 0 ${vw} ${vh}`);
  svg.setAttribute("width", Math.min(vw, 980));
  svg.innerHTML=s;
  svg.querySelectorAll(".nd").forEach(g=>g.onclick=()=>selectNode(which, +g.dataset.id));
}

function nodeLabel(n){
  const p=n.properties||{};
  if(p.first_source) return String(p.first_source).split("/").pop()+(p.predicate?" · pushdown":"");
  if(p.how) return String(p.how);
  if(p.keys) return p.keys.map(x=>String(x).slice(4,-1).replace(/"/g,"")).join(", ");
  if(p.sort_columns?.length) return String(p.sort_columns[0].expr).slice(4,-1).replace(/"/g,"");
  if(p.columns) return `${p.columns.length} cols`;
  return "";
}


/* What each counter actually means. Most are specific to polars' streaming
   engine and are not guessable from the name. */
const GLOSSARY={
  rows_received:["Rows in","Rows this node received from the nodes feeding it."],
  rows_sent:["Rows out","Rows this node passed on. Compare with rows in to see what the node removed or produced."],
  morsels_received:["Morsels received","A morsel is the unit of work in the streaming engine — a batch of rows handed between nodes. Rows ÷ morsels is the average batch size."],
  morsels_sent:["Morsels sent","Batches this node emitted. Far more morsels than its input means the node is splitting work into smaller pieces."],
  largest_morsel_received:["Largest morsel received","Biggest single batch this node took in. Well above the average batch size means uneven partitioning upstream."],
  largest_morsel_sent:["Largest morsel sent","Biggest single batch this node emitted."],
  total_time_ns:["Total time","Poll time plus state-update time for this node. Node times overlap, so they sum to more than the query's wall time."],
  total_poll_time_ns:["Total poll time","Time this node's async tasks spent actually running. The bulk of a node's cost usually sits here."],
  max_poll_time_ns:["Maximum poll time","The longest single poll. A large value means one poll blocked, holding a worker thread while it did."],
  total_polls:["Total number of polls","How many times the engine ran this node's tasks. Many short polls is normal for a streaming operator."],
  total_stolen_polls:["Total polls stolen","Polls picked up by a worker other than the one that queued them. Work stealing is how the engine rebalances; a very low share alongside poor parallel efficiency suggests this node is not spreading across cores."],
  total_state_update_time_ns:["Total state update time","The engine runs in phases. Between phases each node reconfigures — a group-by finalising, a join building its hash table. That work is serial, so time here does not parallelise."],
  max_state_update_time_ns:["Maximum state update time","The longest single state update. A long one is a stall every other node waits through."],
  total_state_updates:["Number state updates","How many phase boundaries this node went through."],
  io_total_active_ns:["IO active time","Time this node had IO in flight. Only meaningful for scans reading remote storage."],
  io_total_bytes_received:["IO bytes received","Bytes actually read. Zero for local files; non-zero when scanning object storage."],
  io_total_bytes_requested:["IO bytes requested","Bytes asked for. Much larger than bytes received means ranges were requested and discarded."],
  done:["Completed","Whether the node had finished when the closing snapshot was taken. If not, its counters are a floor rather than a total."],

  parallel_efficiency:["Parallel efficiency","CPU time ÷ wall time ÷ cores. 1.0 would mean every core busy for the whole query. Low values mean the work is concentrated in one operator or blocked on IO."],
  join_amplification:["Join amplification","Rows out ÷ rows into the probe side. Around 1 means keys are roughly unique; well above means each input row matches many, which is the classic cause of a query exploding in memory."],
  filter_selectivity:["Filter selectivity","Share of rows that survived the filter. Low is good — provided the filter runs early, ideally pushed into the scan."],
  morsel_skew:["Morsel skew","Largest morsel ÷ average morsel. Above 1 means batches are uneven, so some workers get far more rows than others."],
  predicate_pushed:["Predicate pushdown","Whether a filter is applied inside the scan rather than after it. Pushed down, rows are never read at all."],
  projection_efficiency:["Projection","Columns read ÷ columns in the file. Lower is better: unread columns are never decoded."],
};
const help=key=>{
  const g=GLOSSARY[key]; if(!g) return "";
  return `<span class="help" tabindex="0" data-tip="${esc(g[0])}|${esc(g[1])}">?</span>`;
};
(function tooltips(){
  const tip=document.getElementById("tip");
  const show=el=>{
    const [t,b]=el.dataset.tip.split("|");
    tip.innerHTML=`<b>${t}</b>${b}`;
    const r=el.getBoundingClientRect();
    tip.style.opacity=1;
    let x=r.right+10, y=r.top-4;
    if(x+tip.offsetWidth>innerWidth-10) x=r.left-tip.offsetWidth-10;
    if(y+tip.offsetHeight>innerHeight-10) y=innerHeight-tip.offsetHeight-10;
    tip.style.left=Math.max(8,x)+"px"; tip.style.top=Math.max(8,y)+"px";
  };
  const hide=()=>tip.style.opacity=0;
  document.addEventListener("mouseover",e=>{
    const el=e.target.closest?.("[data-tip]"); if(el) show(el);
  });
  document.addEventListener("mouseout",e=>{ if(e.target.closest?.("[data-tip]")) hide(); });
  document.addEventListener("focusin",e=>{ if(e.target.matches?.("[data-tip]")) show(e.target); });
  document.addEventListener("focusout",hide);
})();

const COUNTERS=[
  ["Rows in","rows_received","rows"],["Rows out","rows_sent","rows"],
  ["Morsels received","morsels_received"],["Morsels sent","morsels_sent"],
  ["Largest morsel received","largest_morsel_received","rows"],
  ["Largest morsel sent","largest_morsel_sent","rows"],
  ["Total time","total_time_ns","ns"],["Total poll time","total_poll_time_ns","ns"],
  ["Maximum poll time","max_poll_time_ns","ns"],
  ["Total number of polls","total_polls"],["Total polls stolen","total_stolen_polls"],
  ["Total state update time","total_state_update_time_ns","ns"],
  ["Maximum state update time","max_state_update_time_ns","ns"],
  ["Number state updates","total_state_updates"],
  ["IO active time","io_total_active_ns","ns"],
  ["IO bytes received","io_total_bytes_received","bytes"],
  ["IO bytes requested","io_total_bytes_requested","bytes"],
];

/* Humanised property labels. polars' own names are precise but not prose. */
const PROP_LABELS={
  first_source:"Source", scan_type:"Format", num_sources:"Sources",
  file_columns:"File columns", projected_file_columns:"Projected columns",
  projection:"Projection", predicate:"Predicate",
  predicate_file_skip_applied:"Row groups skipped", has_table_statistics:"Table statistics",
  how:"Join type", left_on:"Left join keys", right_on:"Right join keys",
  nulls_equal:"Nulls equal", coalesce:"Coalesce", maintain_order:"Maintain order",
  validation:"Validation", suffix:"Suffix", keys:"Group by keys", aggs:"Aggregations",
  key_per_input:"Group by keys", aggs_per_input:"Aggregations", num_inputs:"Inputs",
  columns:"Columns", sort_columns:"Sort by", slice:"Slice", limit:"Limit",
  selectors:"Expressions", extend_original:"Extend original", dest:"Destination",
  multithreaded:"Multithreaded", row_index_name:"Row index", pre_slice:"Pre-slice",
  hive_columns:"Hive columns", deletion_files_type:"Deletion files",
  column_mapping_type:"Column mapping", include_file_paths:"Include file paths",
  output_as_boolean:"Output as boolean", row_index_offset:"Row index offset",
};
const ICONS={MultiScan:"▤",Scan:"▤",EquiJoin:"⋈",Join:"⋈",SemiAntiJoin:"⋈",CrossJoin:"⋈",
  GroupBy:"∑",Sort:"↕",TopK:"↧",Filter:"⌕",Select:"ƒ",SimpleProjection:"⊞",
  InMemorySink:"⤓",FileSink:"⤓",IoSink:"⤓",InMemorySource:"⤒",InMemoryMap:"⇄"};
const icon=k=>ICONS[k]||"◻";
const looksExpr=v=>typeof v==="string" && /[()"]/.test(v);
const codeHtml=t=>esc(t).replace(/&quot;([^&]*)&quot;/g,'<span class="s">"$1"</span>');

function propField(key,value){
  const label=PROP_LABELS[key] ?? key.replace(/_/g," ").replace(/^./,c=>c.toUpperCase());
  if(typeof value==="boolean")
    return `<div class="field inline"><span class="lbl">${label}</span>
      <span class="chip">${value?"✓ true":"× false"}</span></div>`;
  if(typeof value==="number" || (typeof value==="string" && !looksExpr(value) && value.length<40))
    return `<div class="field inline"><span class="lbl">${label}</span>
      <span class="chip">${esc(value)}</span></div>`;
  let lines;
  if(Array.isArray(value)){
    lines=value.flat().map(v=>{
      if(v && typeof v==="object" && v.expr!=null)
        return `${v.expr}${v.descending?"  desc":"  asc"}${v.nulls_last?"  nulls last":""}`;
      return typeof v==="object" ? JSON.stringify(v) : String(v);
    });
  } else if(typeof value==="object"){ lines=[JSON.stringify(value,null,1)]; }
  else lines=[String(value)];
  return `<div class="field"><div class="lbl">${label}</div>
    <div class="expr">${lines.map(codeHtml).join("\n")}</div></div>`;
}

function renderNode(p, cmp){
  const el=document.getElementById("node");
  const which=selNode?.plan ?? "physical";
  const n=(p?.plan[which] ?? []).find(x=>x.id===selNode?.id);
  if(!n){ el.innerHTML='<div class="empty">Select a node in the plan.</div>'; return; }
  const m=n.metrics;
  const other=cmp?.plan[which]?.find(x=>x.id===n.id)?.metrics;

  const props=Object.entries(n.properties||{})
    .filter(([k,v])=>v!=null && k!=="type" && !(Array.isArray(v)&&!v.length));

  // IO counters are zero for local files; three rows of 0 is noise, not signal.
  const anyIo = m && (m.io_total_active_ns || m.io_total_bytes_received || m.io_total_bytes_requested);
  const mrow=([label,key,unit])=>{
    if(!m||m[key]==null) return "";
    if(key.startsWith("io_") && !anyIo) return "";
    const raw=m[key];
    const v = unit==="ns" ? ms(raw/1e6)
            : unit==="bytes" ? (raw>=1048576?num(raw/1048576,1)+" MiB":num(raw/1024,1)+" KiB")
            : num(raw)+(unit?`<span class="u">${unit}</span>`:"");
    let d="";
    if(other&&other[key]!=null&&other[key]!==raw){
      const diff=raw-other[key], pct=other[key]?diff/other[key]*100:0;
      d=` <span class="${diff>0?"delta-up":"delta-down"}" style="font-weight:400;font-size:10.5px">${diff>0?"+":""}${num(pct,0)}%</span>`;
    }
    return `<div class="mrow"><span class="k">${label}${help(key)}</span><span class="v">${v}${d}</span></div>`;
  };

  el.innerHTML=`
    <div class="card">
      <div class="hd"><span class="ic">${icon(n.kind)}</span>
        <span class="nm">${n.kind}</span>
        <span style="margin-left:auto;font:10.5px ui-monospace,monospace;color:var(--muted)">#${n.id}</span></div>
      ${props.length?props.map(([k,v])=>propField(k,v)).join("")
        :'<div class="field"><span class="lbl">No properties on this node.</span></div>'}
    </div>
    ${m?`<div class="card">
      <div class="hd"><span class="ic">☰</span><span class="nm">Node metrics</span>
        <span class="badge" data-tip="${esc(GLOSSARY.done[0])}|${esc(GLOSSARY.done[1])}"
          style="margin-left:auto;cursor:help;color:${m.done?"var(--good)":"var(--warn)"}">
          ${m.done?"✓ Completed":"⚠ Unfinished"}</span></div>
      ${COUNTERS.map(mrow).join("")}
    </div>`:'<div class="empty">Logical plan nodes carry structure only.</div>'}`;
}

/* Selecting a node repaints only the right pane and the selection outline.
   Re-rendering main would rebuild the scroll container and jump the plan back
   to the top, which is exactly what you do not want mid-inspection. */
function selectNode(plan, id){
  selNode={plan, id};
  for(const which of ["logical","physical"])
    document.querySelectorAll(`#dag-${which} .nd`).forEach(g=>
      g.setAttribute("data-sel", (which===plan && +g.dataset.id===id)?1:0));
  renderNode(profiles()[sel], compareWith!=null?profiles()[compareWith]:null);
}

/* ---------- top level ---------- */
function render(){
  renderSessions();
  renderQueryList();
  if(!current){ renderBlank(); return; }
  if(sel==null || !profiles()[sel]){ renderOverview(); return; }
  renderDetail();
}

(async function boot(){
  const stored=await allSessions();
  sessions=(stored||[]).sort((a,b)=>b.importedAt-a.importedAt);
  if(sessions.length) selectSession(sessions[0].id);
  document.getElementById("src").textContent =
    sessions.length ? `${sessions.length} session${sessions.length>1?"s":""} stored`
                    : (dbFailed ? "storage unavailable" : "nothing loaded");
  render();
})();
</script>
